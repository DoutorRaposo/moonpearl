name: Release

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub release.
# Running it by hand from a branch only builds the APK and keeps it as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # See build.yml: SDL's sample project ships a wrapper jar that is never run.
      - uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: true

      - name: Version from tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONPEARL_KEYSTORE_BASE64 }}
          MOONPEARL_KEYSTORE_PASSWORD: ${{ secrets.MOONPEARL_KEYSTORE_PASSWORD }}
          MOONPEARL_KEY_ALIAS: ${{ secrets.MOONPEARL_KEY_ALIAS }}
          MOONPEARL_KEY_PASSWORD: ${{ secrets.MOONPEARL_KEY_PASSWORD }}
        run: |
          export MOONPEARL_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$MOONPEARL_KEYSTORE"
          ./gradlew testDebugUnitTest assembleRelease --console=plain \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          rm "$MOONPEARL_KEYSTORE"
          # Only signed builds are named app-release.apk, so this also fails on a signing problem.
          cp app/build/outputs/apk/release/app-release.apk "moonpearl-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: moonpearl-${{ steps.version.outputs.name }}
          path: moonpearl-*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" moonpearl-*.apk --generate-notes --title "$GITHUB_REF_NAME"
