name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SDL's sample project (external/SDL/android-project) ships its own wrapper;
      # it is never run, but the validator scans every wrapper in the checkout.
      - uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: moonpearl-debug
          path: app/build/outputs/apk/debug/*.apk
